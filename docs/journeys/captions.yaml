    key-never-shown: "The model provider row shows the key only as stored; the key text itself appears nowhere on the page."
    key-read-refused: "Omar looks at the provider list again and still sees only the word stored, never the key itself."
    conversation-refused: "Omar opens a Direct message page and sees You cannot see this channel, with a note that it may be private."
