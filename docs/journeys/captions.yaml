# Journey captions (PLAN P12-05, decision E37): one sentence per declared step, written from the pictures of the latest run.
# Form: persona -> journey id -> step id -> caption. Checked by tools/review/check-captions.ts.
omar:
  O3:
    llm-settings: "Omar opens the LLM settings page and sees no model provider yet, with an Add a provider form below."
    provider-added: "A green notice says the provider is added, and its row shows the name Journey OpenAI with its key marked stored."
    alias-bound: "Omar sees the notice that the smart alias is bound to gpt-4o, shown above the Aliases table."
