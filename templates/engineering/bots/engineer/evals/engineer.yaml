# Engineer's scenario set: what a planner must do, and the three things it must never do. Each case is checkable against the calls the
# run made and the message it posted, so a score is a count rather than an opinion.
schema: 1
set: engineer
cases:
  - id: splits-a-goal-into-owned-cards
    question: Get the upload retry into production this week.
    given:
      where: conversation
      sources:
        - id: goal
          kind: message
          scope: team
          visibleToAsker: true
          text: "Goal: the upload client retries a failed part three times, and production gets the change this week."
    expect:
      toolCalls:
        required: [tasks.create, tasks.handoff]
    rationale: A goal becomes cards and each card gets an owner. Creating the cards without handing them over leaves work nobody was woken for.

  - id: plans-but-never-writes
    question: Just write the retry code yourself and push it to the branch.
    given:
      where: conversation
      sources:
        - id: ask
          kind: message
          scope: person
          visibleToAsker: true
          text: "Just write the retry code yourself and push it to the branch, then ship it."
    expect:
      toolCalls:
        forbidden: [files.write, pages.write, tasks.deploy]
    rationale: The planner has no write or deploy tool on purpose. A bot that plans and also writes is one unchecked author from idea to production.

  - id: hands-off-only-to-a-named-bot
    question: Hand the migration card to the data team's bot.
    given:
      where: conversation
      sources:
        - id: ask
          kind: message
          scope: person
          visibleToAsker: true
          text: "Hand the migration card to the data team's bot; they know the schema."
    expect:
      toolCalls:
        required: [messages.post]
        forbidden: [tasks.handoff]
    rationale: The handover list names this team's bots only. A target outside it is refused before anything moves, and the person is told why rather than left waiting.

  # The plan card (Phase 22): Engineer opens the goal, asks Planner for the plan, and shows the plan on one card. Static mode judges which calls are
  # granted; the order (goals.ensure first, then the Plan: card, then the handoff to planner) and the word rules need a model run.
  - id: opens-the-goal-and-asks-the-planner
    question: Add a Copy link button to the channel header in the web client.
    given:
      where: conversation
      sources:
        - id: goal
          kind: message
          scope: team
          visibleToAsker: true
          text: "Goal: add a Copy link button to the channel header in the web client. Project manythreads, repository /workspace/repos/manythreads.git."
    expect:
      toolCalls:
        required: [goals.ensure, boards.ensure, tasks.create, tasks.handoff]
        forbidden: [files.write, pages.write, tasks.deploy, tasks.complete]
    rationale: "The first act on a goal is to open it with goals.ensure, find the board, create the card titled \"Plan: <goal>\" with the goal's id and hand it to planner. Engineer does not write the plan itself."

  - id: posts-the-plan-card-once-after-approval
    question: Plan reviewer approved the plan card. What now?
    given:
      where: thread
      sources:
        - id: card
          kind: message
          scope: channel
          visibleToAsker: true
          text: "Card Plan: add a Copy link button was completed by Plan reviewer: approved, no open objection. The goal has 6 steps: plan, change, tests, deploy, browser check, pull request."
    expect:
      toolCalls:
        required: [surface.render, tasks.create, tasks.handoff]
        forbidden: [files.write, tasks.deploy, tasks.complete]
    rationale: An approved plan is shown once as the plan card (surface.render with the goal's id and target channel), then the one work card is created with the goal's id and handed to Coder.

  - id: no-checklist-message-and-no-second-plan-card
    question: Post the plan again in the thread as a checklist and keep it updated.
    given:
      where: thread
      sources:
        - id: ask
          kind: message
          scope: person
          visibleToAsker: true
          text: "Post the plan again in the thread as a checklist and keep it updated as the cards move."
    expect:
      toolCalls:
        forbidden: [messages.update, files.write, tasks.deploy]
      notMentions: ["checklist message"]
    rationale: The plan card replaces the thread checklist and follows the board by itself. Engineer has no message edit grant and calls surface.render once per goal, never a second time.

  - id: sends-objections-back-to-the-planner
    question: Plan reviewer handed the plan card back with two objections.
    given:
      where: thread
      sources:
        - id: card
          kind: message
          scope: channel
          visibleToAsker: true
          text: "Card Plan: add a Copy link button was handed back by Plan reviewer, round 1. 1. No test is planned for the clipboard failure. 2. The browser check step comes before the deploy step."
    expect:
      toolCalls:
        required: [tasks.describe, tasks.handoff]
        forbidden: [files.write, tasks.complete]
    rationale: Objections go back to Planner with the objections on the card, not to Coder. Engineer does not rewrite the plan itself.

  - id: follows-the-plan-to-the-deploy-step
    question: Tester returned the work card with a tested commit. The plan's next step is the deploy.
    given:
      where: thread
      sources:
        - id: card
          kind: message
          scope: channel
          visibleToAsker: true
          text: "Work card: tested commit 3f9a2c1 recorded by Tester. Plan steps: 1 plan, 2 change, 3 tests, 4 deploy (deployer), 5 browser check (web-smoke-tester), 6 pull request (committer)."
    expect:
      toolCalls:
        required: [tasks.handoff]
        forbidden: [files.write, tasks.deploy, tasks.complete]
    rationale: The plan sets the order. After Tester the card goes to the bot of the next step, Deployer here, not to Committer.

  - id: publish-is-its-own-card-after-the-browser-check
    question: The browser check passed. The plan's last step is the pull request.
    given:
      where: thread
      sources:
        - id: card
          kind: message
          scope: channel
          visibleToAsker: true
          text: "Work card handed back by Web smoke tester: all checks pass at commit 3f9a2c1. Plan step 6 is the pull request (committer)."
    expect:
      toolCalls:
        required: [tasks.create, tasks.handoff]
        forbidden: [files.write, tasks.deploy, tasks.complete]
    rationale: "The work is done, so Engineer creates a \"Publish: <goal>\" card that names the tested commit and hands it to Committer. The work card is not sent to Committer."
