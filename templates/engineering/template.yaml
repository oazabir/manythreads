# Source: SPEC-FINAL §13 (Engineering row), §5.3; prototype #onboarding Step 5 · Teams.
id: engineering
name: Engineering
description: Ship and run software. Dev chat, releases, incidents, alerts and a daily standup, with bots that plan, code, review, test, deploy to a preview and smoke test the running site in a browser.
version: 1
channels:
  - name: "#general"
    purpose: "Team-wide announcements and conversation."
  - name: "#dev"
    purpose: "Day-to-day engineering discussion and code questions."
  - name: "#releases"
    purpose: "Release plans, notes and deploy status."
  - name: "#incidents"
    purpose: "Live incident coordination and follow-ups."
  - name: "#alerts"
    purpose: "Monitoring and CI alerts triaged by bots."
  - name: "#standup"
    purpose: "Daily standup posts and blockers."
board:
  name: Engineering board
  columns: [Open, In progress, Verify, Waiting on a person, Done]
bots:
  - slug: brain
    name: Brain
    role: "Team memory. Answers from what the team did and wrote, and keeps per-person notes."
  - slug: engineer
    name: Engineer
    role: "Plans a goal, has the plan reviewed, then runs the bots that code, review, test, deploy and smoke test it."
  - slug: plan-reviewer
    name: Plan reviewer
    role: "Reads a plan before any code is written and approves it or sends it back."
  - slug: coder
    name: Coder
    role: "Owns a task's branch and writes the change."
  - slug: code-reviewer
    name: Code reviewer
    role: "Reviews the code of a change and sends it back to Coder up to three times."
  - slug: tester
    name: Tester
    role: "Writes automated tests for a reviewed change, runs the whole suite, and sends failures back to Coder."
  - slug: deployer
    name: Deployer
    role: "Deploys a tested commit into the team's preview namespace in k3s and gets it ready for the smoke test."
  - slug: web-smoke-tester
    name: Web smoke tester
    role: "Smoke tests the deployed site with Playwright and headless Chromium and reports what it saw."
  - slug: standup-relay
    name: Standup relay
    role: "Collects updates and posts the daily standup."
    automation: true
  - slug: alert-triage
    name: Alert triage
    role: "Groups and classifies alerts, pages the on-call person."
roleTags: [role:on-call, role:release-manager, role:reviewer]
