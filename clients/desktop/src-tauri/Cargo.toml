[package]
name = "manythreads-desktop"
version = "0.0.0"
description = "The manythreads desktop shell: the live server in a native window"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "manythreads_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
