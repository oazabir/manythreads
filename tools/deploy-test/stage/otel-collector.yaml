# The collector of the stage profile "otel" (PLAN P10-10): receives the server's spans over OTLP/HTTP and prints them to its log (the debug exporter). Applied by
# tools/deploy-test/stage-profile.sh into the stage namespace only. The server finds it at http://otel-collector:4318 (deploy/helm/manythreads/values-stage-otel.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: manythreads-stage
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
    exporters:
      debug:
        verbosity: detailed
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: manythreads-stage
  labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: manythreads-stage-profile }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: manythreads-stage-profile }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.120.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: manythreads-stage
  labels: { app.kubernetes.io/part-of: manythreads-stage-profile }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
