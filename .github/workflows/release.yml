name: release
# Phase exit: tag main as phase-N and v0.N.0, then deploy latest main.
# Exists because the coding sandbox cannot push tags; tags pushed with GITHUB_TOKEN
# do not trigger deploy.yml, so this workflow deploys itself.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Phase number (e.g. 1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate input
        env: { PHASE: "${{ inputs.phase }}" }
        run: '[[ "$PHASE" =~ ^[0-9]{1,2}$ ]] || { echo "phase must be a number"; exit 1; }'
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Tag main
        env: { PHASE: "${{ inputs.phase }}" }
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          for t in "phase-$PHASE" "v0.$PHASE.0"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then echo "$t exists, keeping it"; continue; fi
            git tag -a "$t" -m "Phase $PHASE" && git push -q origin "refs/tags/$t"
          done
      - uses: ./.github/actions/deploy-majlis
        with:
          label: main
          ssh-password: ${{ secrets.ROOT_PASSWORD }}
