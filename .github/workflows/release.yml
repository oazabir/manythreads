name: release
# Phase exit: tag main as phase-N and v0.N.0.
# Runs automatically when a push to main has a head commit titled "Phase N · ..." (the phase PR
# merge commit), or manually via workflow_dispatch.
# Exists because the coding sandbox cannot push tags; tags pushed with GITHUB_TOKEN
# do not trigger deploy.yml, so this workflow tags them itself.
# The deploy of that push is the ci workflow's job (it builds, tests and deploys on the devbox);
# this one only tags, so the two never deploy at the same time.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: Phase number (e.g. 1)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve phase
        id: phase
        env:
          INPUT: ${{ inputs.phase }}
          TITLE: ${{ github.event.head_commit.message }}
        run: |
          P="$INPUT"
          if [ -z "$P" ]; then P=$(printf '%s\n' "$TITLE" | head -1 | sed -nE 's/^Phase ([0-9]{1,2}) ·.*/\1/p'); fi
          if [[ "$P" =~ ^[0-9]{1,2}$ ]]; then echo "phase=$P" >> "$GITHUB_OUTPUT"; else echo "No phase release for this push."; fi
      - if: steps.phase.outputs.phase != ''
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Tag main
        if: steps.phase.outputs.phase != ''
        env: { PHASE: "${{ steps.phase.outputs.phase }}" }
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          for t in "phase-$PHASE" "v0.$PHASE.0"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then echo "$t exists, keeping it"; continue; fi
            git tag -a "$t" -m "Phase $PHASE" && git push -q origin "refs/tags/$t"
          done
      # The one-command installer (P27-04/05): its script, the host command and their hashes go on the GitHub release of the tag. This step carries code only: it never
      # pushes an image (the images go to GHCR from the owner's machine with tools/devbox/release-images.sh, which also makes release.json).
      - name: Attach the installer to the release
        if: steps.phase.outputs.phase != ''
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.$PHASE.0"
          dir=$(mktemp -d)
          cp deploy/install/install.sh deploy/install/manythreads "$dir/"
          (cd "$dir" && sha256sum install.sh manythreads > SHA256SUMS)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "manythreads $tag" --notes "Phase $PHASE. Install on a fresh Linux machine: download install.sh from this release (check it against SHA256SUMS) and run it with --release-url pointing at this release's release.json." --verify-tag
          fi
          gh release upload "$tag" "$dir/install.sh" "$dir/manythreads" "$dir/SHA256SUMS" --clobber
