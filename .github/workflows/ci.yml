name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The image build downloads from apt and GitHub; a stalled network call must fail fast and retry, not hold the job for 30 minutes.
      - name: Build Postgres 19 image
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if timeout 360 docker build -t manythreads/postgres:19 deploy/postgres; then exit 0; fi
            echo "docker build attempt $attempt failed or timed out"
          done
          exit 1

      - name: Start Postgres
        run: |
          docker run -d --name manythreads-pg -p 55432:5432 \
            -e POSTGRES_USER=manythreads_owner \
            -e POSTGRES_PASSWORD=manythreads \
            -e POSTGRES_DB=manythreads \
            manythreads/postgres:19
          for i in $(seq 1 60); do
            if docker exec manythreads-pg pg_isready -U manythreads_owner -d manythreads; then exit 0; fi
            sleep 2
          done
          docker logs manythreads-pg | tail -n 40
          exit 1

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rls
      - run: pnpm test:events
      - run: pnpm test:schema-compat

      - name: Install Playwright Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e --pass-with-no-tests

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
