name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Postgres 19 image
        run: docker build -t majlis/postgres:19 deploy/postgres

      - name: Start Postgres
        run: |
          docker run -d --name majlis-pg -p 55432:5432 \
            -e POSTGRES_USER=majlis_owner \
            -e POSTGRES_PASSWORD=majlis \
            -e POSTGRES_DB=majlis \
            majlis/postgres:19
          for i in $(seq 1 60); do
            if docker exec majlis-pg pg_isready -U majlis_owner -d majlis; then exit 0; fi
            sleep 2
          done
          docker logs majlis-pg | tail -n 40
          exit 1

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rls
      - run: pnpm test:events
      - run: pnpm test:schema-compat

      - name: Install Playwright Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e --pass-with-no-tests

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
