name: ci

# The runner does nothing but carry the code to the devbox: the build, the tests and the
# deploy all happen on the box that owns the cluster (tools/devbox/ci.sh). A GitHub runner
# costs minutes we do not have, its image carries no browser (so the end-to-end tests
# could not run there at all), and the devbox is where the whole team already works.
#
# A pull request builds and tests the candidate in the CI namespace and stops there. A push
# to main does the same and then promotes the very same build to the live namespace.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devbox:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Copy the tree to the devbox
        env:
          SSHPASS: ${{ secrets.ROOT_PASSWORD }}
        run: |
          source "$GITHUB_WORKSPACE/.github/actions/lib/remote.sh"
          # A fresh directory every run: the devbox keeps its own checkout at /root/manythreads
          # for the Windows dev loop, and this one is only the pipeline's scratch space.
          remote 'rm -rf /root/ci && mkdir -p /root/ci'
          tar czf - --exclude=node_modules --exclude=.codegraph --exclude=temp \
            --exclude=e2e/test-results --exclude=e2e/playwright-report . \
            | remote 'tar xzf - -C /root/ci'
          remote 'cd /root/ci && git rev-parse --short=12 HEAD'

      - name: Build, test and deploy on the devbox
        env:
          SSHPASS: ${{ secrets.ROOT_PASSWORD }}
        run: |
          source "$GITHUB_WORKSPACE/.github/actions/lib/remote.sh"
          DEPLOY_FLAG=""
          if [ "${{ github.event_name }}" = "push" ]; then DEPLOY_FLAG=""; else DEPLOY_FLAG="--no-deploy"; fi
          remote "cd /root/ci && bash tools/devbox/ci.sh $DEPLOY_FLAG"
