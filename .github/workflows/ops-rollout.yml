name: ops-rollout
# Quick rollout of any branch/sha without tagging.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit sha to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          [ -z "$REF" ] || printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "invalid ref"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/deploy-majlis
        with:
          label: ${{ inputs.ref || github.sha }}
          ssh-password: ${{ secrets.ROOT_PASSWORD }}
