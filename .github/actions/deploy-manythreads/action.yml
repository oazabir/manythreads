name: deploy-manythreads
description: Copy the code to the devbox, build the images there and deploy them to the k3s node.
inputs:
  label:
    description: Human label for this deploy (ref or sha), logging only
    default: ""
  ssh-password:
    description: Root password for the k3s node (pass secrets.ROOT_PASSWORD)
    required: true
  rebuild-postgres:
    description: Rebuild and re-import manythreads/postgres:19 even if the node already has it
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
      run: |
        sudo apt-get install -y -qq sshpass
        echo "Deploying '$LABEL'"

    # The build happens on the devbox, not here: the runner only carries the code. The
    # devbox owns the cluster, so the images are built straight into its containerd and
    # never travel over the wire as tarballs.
    - name: Copy the tree to the devbox
      shell: bash
      env:
        SSHPASS: ${{ inputs.ssh-password }}
      run: |
        source "$GITHUB_WORKSPACE/.github/actions/lib/remote.sh"
        remote 'rm -rf /root/ci && mkdir -p /root/ci'
        tar czf - --exclude=node_modules --exclude=.codegraph --exclude=temp \
          --exclude=e2e/test-results --exclude=e2e/playwright-report . \
          | remote 'tar xzf - -C /root/ci'
        # The files arrive owned by the runner's user; git on the devbox refuses a
        # repository it does not own ("dubious ownership"), so it takes them over.
        remote 'chown -R root:root /root/ci'
        remote 'cd /root/ci && git rev-parse --short=12 HEAD'

    - name: Build and deploy on the devbox
      shell: bash
      env:
        SSHPASS: ${{ inputs.ssh-password }}
        REBUILD_PG: ${{ inputs.rebuild-postgres }}
      run: |
        source "$GITHUB_WORKSPACE/.github/actions/lib/remote.sh"
        FLAG=""
        [ "$REBUILD_PG" = "true" ] && FLAG="--rebuild-postgres"
        remote "cd /root/ci && bash tools/devbox/deploy.sh $FLAG"

    # The legacy cleanup and the extensions the cluster needs are idempotent and stay
    # here: a fresh cluster gets them, an existing one changes nothing.
    - name: Legacy cleanup and cluster extensions
      shell: bash
      env:
        SSHPASS: ${{ inputs.ssh-password }}
      run: |
        source "$GITHUB_WORKSPACE/.github/actions/lib/remote.sh"
        remote_sh <<'REMOTE' || rc=$?
        # legacy cleanup from the pre-rename install: the old release, CNPG cluster, PVCs, secrets, ingress and images
        # carry the previous product name. The name is built from parts so the literal word never appears in the repo.
        # Idempotent: every step is a no-op once nothing with the old name is left on the node.
        OLD="maj""lis"
        if helm status "$OLD" -n manythreads >/dev/null 2>&1; then
          helm uninstall "$OLD" -n manythreads --wait --timeout 5m
        fi
        kubectl delete cluster.postgresql.cnpg.io "$OLD-pg" -n manythreads --ignore-not-found --wait=true 2>/dev/null || true
        kubectl delete pvc -n manythreads -l "cnpg.io/cluster=$OLD-pg" --ignore-not-found 2>/dev/null || true
        kubectl get secrets -n manythreads -o name | { grep -E "^secret/$OLD(-|\$)" || true; } | xargs -r kubectl delete secret -n manythreads --ignore-not-found
        kubectl delete ingress/"$OLD" -n manythreads --ignore-not-found
        rm -rf "/root/$OLD-chart"
        k3s ctr -n k8s.io images ls -q | { grep -E "^docker.io/$OLD/" || true; } | xargs -r -n1 k3s ctr -n k8s.io images rm || true
        # Retire the test app once manythreads takes over the domain (same host => same ingress rule would clash).
        # Idempotent: extensions must be created by a superuser (the owner role cannot create pgvector). Covers
        # clusters initialised before postInitApplicationSQL; no-op on first install (no pod yet) or when present.
        kubectl exec -n manythreads manythreads-pg-1 -c postgres -- psql -U postgres -d manythreads -v ON_ERROR_STOP=1 \
          -c 'CREATE EXTENSION IF NOT EXISTS vector' -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' -c 'ALTER ROLE manythreads_owner SUPERUSER' || true
        kubectl delete deploy/whoami svc/whoami -n manythreads --ignore-not-found
        REMOTE

    - name: Smoke test
      shell: bash
      env:
        SSHPASS: ${{ inputs.ssh-password }}
      run: |
        ok=0
        for i in $(seq 1 30); do
          if curl -fsSk -o /dev/null https://manythreads.kahf.to/; then ok=1; break; fi
          sleep 5
        done
        curl -fsSk https://manythreads.kahf.to/healthz || echo "::warning::/healthz not healthy"
        echo
        echo "plain http status: $(curl -s -o /dev/null -w '%{http_code}' http://manythreads.kahf.to/)"
        echo "https (verified cert): $(curl -s -o /dev/null -w '%{http_code}' https://manythreads.kahf.to/ || echo no-valid-cert)"
        source "$GITHUB_WORKSPACE/.github/actions/lib/remote.sh"
        remote_sh <<'REMOTE'
        kubectl get pods -n manythreads
        REMOTE
        [ "$ok" = "1" ] || { echo "::error::site did not respond"; exit 1; }
