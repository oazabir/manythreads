{{- if eq .Values.postgres.mode "statefulset" }}
apiVersion: v1
kind: Service
metadata:
  name: majlis-pg-rw
  labels:
    {{- include "majlis.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: majlis-pg-init
data:
  10-init.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: majlis-pg
  labels:
    {{- include "majlis.labels" . | nindent 4 }}
spec:
  serviceName: majlis-pg-rw
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        cnpg.io/cluster: majlis-pg
    spec:
      securityContext:
        runAsUser: {{ .Values.postgres.uid }}
        runAsGroup: {{ .Values.postgres.gid }}
        fsGroup: {{ .Values.postgres.gid }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.owner }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: majlis-db-owner, key: password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [sh, -c, "pg_isready -U {{ .Values.postgres.owner }} -d {{ .Values.postgres.database }}"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: majlis-pg-init, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storage.storageClass }}
        resources: { requests: { storage: {{ .Values.postgres.storage.size }} } }
{{- end }}
