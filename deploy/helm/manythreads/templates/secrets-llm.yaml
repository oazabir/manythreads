{{- /*
  Keys for the LLM gateway (LiteLLM) and the memory engine (Hindsight), generated once and kept across upgrades
  (lookup + helm.sh/resource-policy: keep, the same pattern as secrets-server.yaml). `helm template` has no cluster to
  look up and shows throwaway values.
    litellm-master-key   LITELLM_MASTER_KEY: the proxy's admin key; only the manythreads server (gateway-llm) holds it
    litellm-salt-key     LITELLM_SALT_KEY: encrypts provider keys stored in the litellm database. NEVER rotate it: stored provider keys become unreadable
    hindsight-db-password  password of the database login role `hindsight`
    hindsight-api-key    the tenant api key the manythreads server presents to Hindsight
    hindsight-llm-key    a LiteLLM virtual key limited to the alias `fast`, minted by Hindsight's init container; never the master key
*/ -}}
{{- if or .Values.litellm.enabled .Values.hindsight.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "manythreads-llm-secrets" }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data | default dict }}{{ end }}
{{- $master := "" }}{{- $salt := "" }}{{- $dbpw := "" }}{{- $api := "" }}{{- $llm := "" }}
{{- if hasKey $data "litellm-master-key" }}{{ $master = index $data "litellm-master-key" }}{{ else }}{{ $master = printf "sk-%s" (randAlphaNum 40) | b64enc }}{{ end }}
{{- if hasKey $data "litellm-salt-key" }}{{ $salt = index $data "litellm-salt-key" }}{{ else }}{{ $salt = printf "sk-%s" (randAlphaNum 40) | b64enc }}{{ end }}
{{- if hasKey $data "hindsight-db-password" }}{{ $dbpw = index $data "hindsight-db-password" }}{{ else }}{{ $dbpw = randAlphaNum 32 | b64enc }}{{ end }}
{{- if hasKey $data "hindsight-api-key" }}{{ $api = index $data "hindsight-api-key" }}{{ else }}{{ $api = printf "hs-%s" (randAlphaNum 40) | b64enc }}{{ end }}
{{- if hasKey $data "hindsight-llm-key" }}{{ $llm = index $data "hindsight-llm-key" }}{{ else }}{{ $llm = printf "sk-%s" (randAlphaNum 40) | b64enc }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: manythreads-llm-secrets
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  litellm-master-key: {{ $master | quote }}
  litellm-salt-key: {{ $salt | quote }}
  hindsight-db-password: {{ $dbpw | quote }}
  hindsight-api-key: {{ $api | quote }}
  hindsight-llm-key: {{ $llm | quote }}
{{- end }}
