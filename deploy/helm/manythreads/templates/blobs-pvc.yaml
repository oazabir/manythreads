{{- if and .Values.server.enabled .Values.server.blobs.persistence.enabled }}
{{- /*
  Attachment bytes for storage-local (MANYTHREADS_STORAGE_DIR): one claim on the cluster's local-path class, mounted into the
  server Deployment and the seed Job. `keep` (default) leaves it behind on helm uninstall so uploads survive. Immutable once
  bound: change size/class by hand (expanding is `kubectl patch` on the claim if the class allows it).
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manythreads-blobs
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
    app.kubernetes.io/component: blobs
  {{- if .Values.server.blobs.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [{{ .Values.server.blobs.persistence.accessMode }}]
  {{- with .Values.server.blobs.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.server.blobs.persistence.size }}
{{- end }}
