{{- /*
  Server secrets, generated once and kept across upgrades via lookup (so a `helm upgrade` never rotates them):
    kms-key          MANYTHREADS_KMS_KEY, base64 of exactly 32 bytes (32 random printable characters, base64-encoded)
    test-auth-token  MANYTHREADS_TEST_AUTH_TOKEN, 40 random alphanumerics (>= 16 required by the server)
    kms-previous-keys MANYTHREADS_KMS_PREVIOUS_KEYS, from values `kms.previousKeys` (empty by default); a stored value is kept
                     when the value is empty, and `-` clears it
  `helm template` and --dry-run have no cluster to look up and show throwaway values.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "manythreads-server-secrets" }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data | default dict }}{{ end }}
{{- /* `data` fields are base64 of the value: the KMS value is itself base64 text, so a new key is encoded twice. */ -}}
{{- $kms := "" }}
{{- if hasKey $data "kms-key" }}{{ $kms = index $data "kms-key" }}{{ else }}{{ $kms = randAscii 32 | b64enc | b64enc }}{{ end }}
{{- $tok := "" }}
{{- if hasKey $data "test-auth-token" }}{{ $tok = index $data "test-auth-token" }}{{ else }}{{ $tok = randAlphaNum 40 | b64enc }}{{ end }}
{{- $prev := "" }}
{{- if .Values.kms.previousKeys }}
{{- if ne (toString .Values.kms.previousKeys) "-" }}{{ $prev = toString .Values.kms.previousKeys | b64enc }}{{ end }}
{{- else if hasKey $data "kms-previous-keys" }}{{ $prev = index $data "kms-previous-keys" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: manythreads-server-secrets
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # a value read back from the cluster is kept as is
  kms-key: {{ $kms | quote }}
  test-auth-token: {{ $tok | quote }}
  kms-previous-keys: {{ $prev | quote }}
