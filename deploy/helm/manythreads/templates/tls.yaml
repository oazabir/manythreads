{{- $mode := include "manythreads.tlsMode" . }}
{{- $le := .Values.tls.letsencrypt }}
{{- $secret := include "manythreads.tlsSecret" . }}
{{- if eq $mode "letsencrypt" }}
# Let's Encrypt through cert-manager. The Issuer is namespaced (it lives in the release namespace and serves only it), not a ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: manythreads-letsencrypt
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
spec:
  acme:
    {{- with $le.email }}
    email: {{ . | quote }}   # optional: Let's Encrypt no longer sends expiry mail, it only identifies the account
    {{- end }}
    server: {{ if eq $le.server "staging" }}https://acme-staging-v02.api.letsencrypt.org/directory{{ else }}https://acme-v02.api.letsencrypt.org/directory{{ end }}
    privateKeySecretRef:
      name: manythreads-letsencrypt-account
    solvers:
      {{- if include "manythreads.wildcard" . }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $le.dns01.apiTokenSecret }}
              key: {{ $le.dns01.apiTokenKey | default "api-token" }}
      {{- else }}
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className | default "traefik" }}
            # ClusterIP: cert-manager's default is a NodePort Service for the challenge pod, which a deploy target's admission rule refuses
            serviceType: ClusterIP
      {{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: manythreads-tls
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
spec:
  secretName: {{ $secret }}
  issuerRef:
    name: manythreads-letsencrypt
    kind: Issuer
  dnsNames:
    - {{ .Values.domain | quote }}
    {{- if include "manythreads.wildcard" . }}
    - {{ printf "*.%s" .Values.domain | quote }}
    {{- end }}
{{- end }}
{{- if and $secret .Values.tls.defaultStore }}
---
# Traefik's default certificate. App Ingresses live in other namespaces and cannot read the Secret above, so they would get Traefik's
# self-signed one; the store named `default` hands them this certificate instead (the wildcard one in `host` routing; with `path` routing the
# apps share the platform's host, whose own Ingress already carries the certificate, and the store is the safe fallback).
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
spec:
  defaultCertificate:
    secretName: {{ $secret }}
{{- end }}
