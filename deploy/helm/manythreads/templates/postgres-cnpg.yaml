{{- if eq .Values.postgres.mode "cnpg" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: manythreads-pg
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  imagePullPolicy: {{ .Values.imagePullPolicy }}
  postgresUID: {{ .Values.postgres.uid }}
  postgresGID: {{ .Values.postgres.gid }}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
      secret:
        name: manythreads-db-owner
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        # kernel migrations create/alter the app+system roles and pgvector, which needs SUPERUSER (same as dev compose)
        - ALTER ROLE {{ .Values.postgres.owner }} SUPERUSER
  storage:
    size: {{ .Values.postgres.storage.size }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
