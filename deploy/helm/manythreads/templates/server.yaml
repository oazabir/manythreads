{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manythreads-server
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  {{- if or .Values.server.blobs.persistence.enabled .Values.server.repos.persistence.enabled }}
  # the blob and repository volumes are ReadWriteOnce: the old pod releases them before the new one starts (see values server.blobs, server.repos)
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "manythreads.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.hermesPods.enabled }}
      # the hermes-pods plugin talks to the Kubernetes API with this account (a Role in this namespace; templates/hermes-pods.yaml)
      serviceAccountName: manythreads-server
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if or .Values.server.blobs.persistence.enabled .Values.server.repos.persistence.enabled }}
      securityContext:
        fsGroup: 1000   # `node` in the image; a no-op on local-path, needed on volumes that honour fsGroup
      {{- end }}
      containers:
        - name: server
          image: {{ .Values.server.image }}:{{ .Values.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.server.port }} }]
          env:
            - { name: PORT, value: {{ .Values.server.port | quote }} }
            - name: OWNER_PW
              valueFrom: { secretKeyRef: { name: manythreads-db-owner, key: password } }
            - name: MANYTHREADS_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: manythreads-db-app, key: password } }
            - name: MANYTHREADS_SYSTEM_PASSWORD
              valueFrom: { secretKeyRef: { name: manythreads-db-system, key: password } }
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.owner }}:$(OWNER_PW)@{{ include "manythreads.pgHost" . }}:5432/{{ .Values.postgres.database }}
            - name: MANYTHREADS_APP_DATABASE_URL
              value: postgres://{{ .Values.postgres.appRole }}:$(MANYTHREADS_APP_PASSWORD)@{{ include "manythreads.pgHost" . }}:5432/{{ .Values.postgres.database }}
            - name: MANYTHREADS_SYSTEM_DATABASE_URL
              value: postgres://{{ .Values.postgres.systemRole }}:$(MANYTHREADS_SYSTEM_PASSWORD)@{{ include "manythreads.pgHost" . }}:5432/{{ .Values.postgres.database }}
            - name: MANYTHREADS_KMS_KEY
              valueFrom: { secretKeyRef: { name: manythreads-server-secrets, key: kms-key } }
            - { name: MANYTHREADS_PUBLIC_URL, value: {{ .Values.publicUrl | default (printf "https://%s" .Values.domain) | quote }} }
            {{- /* Behind Cloudflare the client is one proxy hop further out (Cloudflare appends to X-Forwarded-For too). An explicit server.env value wins. */}}
            {{- $tlsMode := include "manythreads.tlsMode" . }}
            {{- if not (hasKey .Values.server.env "MANYTHREADS_TRUST_PROXY") }}
            - { name: MANYTHREADS_TRUST_PROXY, value: {{ if eq $tlsMode "cloudflare" }}{{ add (int .Values.server.trustProxy) 1 | quote }}{{ else }}{{ .Values.server.trustProxy | quote }}{{ end }} }
            {{- end }}
            {{- /* Behind Cloudflare the visitor's address is also in `CF-Connecting-IP`, which Cloudflare sets itself. On a k3s node whose Traefik Service keeps
                   `externalTrafficPolicy: Cluster` the load balancer rewrites the source address, so the forwarded chain names only the cluster's own hops
                   (every visitor became 10.42.0.1) and the chain cannot be trusted to tell visitors apart: the header is. Close the origin to Cloudflare (docs/deploy.md). */}}
            {{- if and (eq $tlsMode "cloudflare") (not (hasKey .Values.server.env "MANYTHREADS_CLIENT_IP_HEADER")) }}
            - { name: MANYTHREADS_CLIENT_IP_HEADER, value: "cf-connecting-ip" }
            {{- end }}
            - { name: MANYTHREADS_TLS_MODE, value: {{ $tlsMode | quote }} }
            - { name: MANYTHREADS_TLS_WILDCARD, value: {{ if and (include "manythreads.wildcard" .) (ne $tlsMode "none") }}"1"{{ else }}"0"{{ end }} }
            {{- if eq $tlsMode "cloudflare" }}
            - { name: MANYTHREADS_TLS_ORIGIN, value: {{ .Values.tls.cloudflare.origin | quote }} }
            {{- end }}
            {{- if eq $tlsMode "letsencrypt" }}
            - { name: MANYTHREADS_TLS_ACME_SERVER, value: {{ .Values.tls.letsencrypt.server | quote }} }
            {{- end }}
            - { name: MANYTHREADS_MAIL_FROM, value: {{ .Values.mail.from | quote }} }
            {{- $smtp := .Values.mail.smtpUrl }}
            {{- if and (not $smtp) .Values.mailpit.enabled }}{{ $smtp = "smtp://manythreads-mailpit:1025" }}{{ end }}
            {{- if $smtp }}
            - { name: MANYTHREADS_SMTP_URL, value: {{ $smtp | quote }} }
            {{- end }}
            {{- include "manythreads.storageEnv" . | nindent 12 }}
            - { name: MANYTHREADS_STORAGE_DIR, value: {{ .Values.server.blobs.persistence.mountPath | quote }} }
            - { name: MANYTHREADS_BLOB_GC, value: {{ .Values.server.blobGc.mode | quote }} }
            - { name: MANYTHREADS_BLOB_GC_GRACE_HOURS, value: {{ .Values.server.blobGc.graceHours | quote }} }
            - { name: MANYTHREADS_FILES_ORPHAN_DAYS, value: {{ .Values.server.blobGc.orphanDays | quote }} }
            {{- if .Values.server.blobGc.adoptMarker }}
            - { name: MANYTHREADS_BLOB_GC_ADOPT_MARKER, value: "1" }
            {{- end }}
            {{- if .Values.server.blobGc.allowEmpty }}
            - { name: MANYTHREADS_BLOB_GC_ALLOW_EMPTY, value: "1" }
            {{- end }}
            - { name: MANYTHREADS_REPO_DIR, value: {{ .Values.server.repos.persistence.mountPath | quote }} }
            # The bearer token for GET /metrics (docs/deploy/monitoring.md). Without it the route answers 404.
            - name: MANYTHREADS_METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: manythreads-server-secrets, key: metrics-token, optional: true } }
            # The server's own signing key for browser push (generated once into the secret). Without it push is reported as unavailable.
            - name: MANYTHREADS_VAPID_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: manythreads-server-secrets, key: vapid-private-key, optional: true } }
            - name: MANYTHREADS_KMS_PREVIOUS_KEYS
              valueFrom: { secretKeyRef: { name: manythreads-server-secrets, key: kms-previous-keys, optional: true } }
            {{- if .Values.testAuth.enabled }}
            # TEST ENVIRONMENT ONLY (see values.yaml testAuth)
            - name: MANYTHREADS_TEST_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: manythreads-server-secrets, key: test-auth-token } }
            - { name: MANYTHREADS_ALLOW_TEST_AUTH_IN_PRODUCTION, value: "1" }
            {{- end }}
            {{- /* The in-cluster gateway and memory engine, unless server.env names its own URL (the demo overlay points at stand-ins). */}}
            {{- if and .Values.litellm.enabled (not (hasKey .Values.server.env "MANYTHREADS_LITELLM_URL")) }}
            - { name: MANYTHREADS_LITELLM_URL, value: "http://manythreads-litellm:4000" }
            - name: MANYTHREADS_LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: manythreads-llm-secrets, key: litellm-master-key } }
            {{- end }}
            {{- if and .Values.hindsight.enabled (not (hasKey .Values.server.env "MANYTHREADS_HINDSIGHT_URL")) }}
            - { name: MANYTHREADS_HINDSIGHT_URL, value: "http://manythreads-hindsight:8888" }
            - name: MANYTHREADS_HINDSIGHT_API_KEY
              valueFrom: { secretKeyRef: { name: manythreads-llm-secrets, key: hindsight-api-key } }
            {{- end }}
            {{- with .Values.hermesPods }}
            {{- if .enabled }}
            - { name: MANYTHREADS_HERMES_PODS, value: "1" }
            - { name: MANYTHREADS_HERMES_PODS_NAMESPACE, value: {{ .namespace | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_HERMES_IMAGE, value: {{ .images.hermes | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_WORKBENCH_IMAGE, value: {{ .images.workbench | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_WORKSPACE_SIZE, value: {{ .workspaceSize | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_HOME_SIZE, value: {{ .homeSize | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_STORAGE_CLASS, value: {{ .storageClass | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_REPOS, value: {{ join "," .repos | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_REPO_ORIGIN_ALLOW, value: {{ join "," .repoOriginAllow | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_DEPLOYER_BOT, value: {{ .deployerBot | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_APPS_PREFIX, value: {{ .apps.prefix | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_APPS_ROUTING, value: {{ include "manythreads.appsRouting" $ | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_APPS_HOST, value: {{ include "manythreads.appsHost" $ | quote }} }
            {{- $dt := list }}
            {{- range .deployTargets }}{{ $dt = append $dt (dict "team" .team "namespace" .namespace "hosts" (.hosts | default list)) }}{{ end }}
            - { name: MANYTHREADS_HERMES_PODS_DEPLOY_TARGETS, value: {{ toJson $dt | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_HOST_API_SERVER, value: {{ (.hostApiServer | default "") | quote }} }
            - { name: MANYTHREADS_HERMES_PODS_RESOURCES, value: {{ dict "hermes" .hermesResources "workbench" .workbenchResources | toJson | quote }} }
            {{- /* Team pods live in another namespace: a short Service name would not resolve there, so the profiles get full ones. */}}
            - { name: MANYTHREADS_INCLUSTER_URL, value: {{ printf "http://manythreads-server.%s.svc.cluster.local:3000" $.Release.Namespace | quote }} }
            - { name: MANYTHREADS_INCLUSTER_LLM_URL, value: {{ printf "http://manythreads-litellm.%s.svc.cluster.local:4000/v1" $.Release.Namespace | quote }} }
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.server.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: blobs, mountPath: {{ .Values.server.blobs.persistence.mountPath | quote }} }
            - { name: repos, mountPath: {{ .Values.server.repos.persistence.mountPath | quote }} }
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: blobs
          {{- if .Values.server.blobs.persistence.enabled }}
          persistentVolumeClaim: { claimName: manythreads-blobs }
          {{- else }}
          emptyDir: { sizeLimit: {{ .Values.server.blobs.persistence.size | default "1Gi" | quote }} }
          {{- end }}
        - name: repos
          {{- if .Values.server.repos.persistence.enabled }}
          persistentVolumeClaim: { claimName: manythreads-repos }
          {{- else }}
          emptyDir: { sizeLimit: {{ .Values.server.repos.persistence.size | default "1Gi" | quote }} }
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: manythreads-server
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: {{ .Values.server.port }}, targetPort: http }
{{- end }}
