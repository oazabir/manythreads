{{- /* Passwords are generated once and kept across upgrades via lookup. */ -}}
{{- range $name, $user := dict "manythreads-db-owner" .Values.postgres.owner "manythreads-db-app" .Values.postgres.appRole "manythreads-db-system" .Values.postgres.systemRole }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $pw := randAlphaNum 32 }}
{{- if $existing }}{{ $pw = index $existing.data "password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "manythreads.labels" $ | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $user }}
  password: {{ $pw | quote }}
---
{{- end }}
