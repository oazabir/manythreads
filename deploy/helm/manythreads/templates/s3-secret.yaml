{{- if and (eq .Values.server.storage.type "s3") (not .Values.server.storage.s3.existingSecret) .Values.server.storage.s3.accessKey .Values.server.storage.s3.secretKey }}
{{- /*
  S3 credentials from values (accessKey/secretKey): kept on uninstall like the other server secrets. Prefer `existingSecret` so the values
  never touch the release's stored manifest; this Secret is for setups that pass them with --set-file. Not rendered for the pod's AWS
  credential chain (no values) or for an existing Secret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: manythreads-s3
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.server.storage.s3.accessKeyKey }}: {{ .Values.server.storage.s3.accessKey | quote }}
  {{ .Values.server.storage.s3.secretKeyKey }}: {{ .Values.server.storage.s3.secretKey | quote }}
{{- end }}
