{{- if .Values.ingress.enabled }}
{{- $tlsMode := include "manythreads.tlsMode" . }}
{{- $tlsSecret := include "manythreads.tlsSecret" . }}
{{- $flexible := and (eq $tlsMode "cloudflare") (eq .Values.tls.cloudflare.origin "flexible") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manythreads
  labels:
    {{- include "manythreads.labels" . | nindent 4 }}
  {{- $ann := .Values.ingress.annotations | default dict }}
  {{- /* Cloudflare "Flexible": Cloudflare speaks plain HTTP to us, so the router must answer on the `web` entrypoint (port 80) as well. */}}
  {{- if $flexible }}{{ $ann = merge (deepCopy $ann) (dict "traefik.ingress.kubernetes.io/router.entrypoints" "web,websecure") }}{{ end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- $ipHost := regexMatch "^[0-9.]+$" .Values.domain }}
  {{- $extra := .Values.extraDomains | default list }}
  {{- if $tlsSecret }}
  tls:
    - {{- if not $ipHost }}
      hosts: [{{ include "manythreads.allDomains" . | splitList "," | join ", " }}]
      {{- end }}
      secretName: {{ $tlsSecret }}
  {{- else if and (eq $tlsMode "none") .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.domain }}]
      {{- if .Values.ingress.tls.secretName }}
      secretName: {{ .Values.ingress.tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    {{- /* A bare address is not a name an Ingress may match on: the rule then has no host and answers whatever the visitor typed. */}}
    - {{- if not $ipHost }}
      host: {{ .Values.domain }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: manythreads-web, port: { name: http } }
    {{- range $extra }}
    {{- if ne . $.Values.domain }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: manythreads-web, port: { name: http } }
    {{- end }}
    {{- end }}
{{- end }}
