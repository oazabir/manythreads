# Image tags default to .Values.imageTag (the deploy action sets it to the git sha).
imageTag: dev
imagePullPolicy: IfNotPresent

domain: manythreads.kahf.to
# Public base URL (links in mails, OIDC redirect URIs; Secure cookies follow it). Empty = https://<domain>.
publicUrl: ""

# HTTPS, one of three modes (docs/deploy.md "HTTPS: Cloudflare or Let's Encrypt"):
#   none         no certificate from this chart. `ingress.tls.*` below still lets you name a Secret you made yourself.
#   cloudflare   Cloudflare's proxy terminates TLS for visitors. `cloudflare.origin: strict` (recommended, SSL/TLS mode "Full (strict)"): the cluster
#                serves a Cloudflare Origin CA certificate from the kubernetes.io/tls Secret `certSecret` (made by tools/devbox/deploy.sh --origin-cert
#                --origin-key). `flexible` (not recommended): Cloudflare talks plain HTTP to the cluster, so the router also answers on port 80.
#   letsencrypt  The cluster is reached directly; cert-manager (installed by deploy.sh in this mode) asks Let's Encrypt for a certificate.
#                Without `wildcard` it proves ownership by answering a web request on port 80 (HTTP-01, through Traefik). With `wildcard` it must
#                prove ownership with a DNS record (DNS-01): `dns01` names the DNS provider (only `cloudflare`) and a Secret holding its API token.
# `wildcard` also covers *.<domain>, the hosts of the apps bots deploy (<app>--<team>.<domain>); only used with hermesPods.apps.routing=host. In either mode a Traefik TLSStore named `default`
# then makes the wildcard certificate Traefik's default, so app Ingresses in other namespaces (which cannot read this Secret) get it too.
tls:
  mode: none            # none | cloudflare | letsencrypt
  # Render the Traefik TLSStore named `default` (Traefik's default certificate, see the comment above). A second release in the same cluster
  # (a preview install in a deploy target) must set this false: two stores named `default` fight over the one default certificate.
  defaultStore: true
  wildcard: true        # also cover *.<domain> (the hosts of apps bots deploy)
  cloudflare:
    origin: strict      # strict | flexible
    certSecret: manythreads-origin-cert   # kubernetes.io/tls Secret holding the Origin CA certificate for <domain> and *.<domain>
    # Cloudflare's published ranges (https://www.cloudflare.com/ips/). tools/devbox/deploy.sh gives them to Traefik as the proxies whose
    # X-Forwarded-* headers it believes (Traefik's HelmChartConfig in kube-system is cluster-wide, so the chart does not render it). Refresh from the page above.
    trustedIPs:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
  letsencrypt:
    email: ""           # required: Let's Encrypt writes here about expiring certificates
    server: production  # production | staging (staging certificates are not trusted by browsers; use it to test without hitting rate limits)
    dns01:              # required when tls.wildcard is true
      provider: cloudflare
      apiTokenSecret: manythreads-cloudflare-dns   # Secret with a Cloudflare API token that may edit DNS for the zone (made by deploy.sh --dns-token-file)
      apiTokenKey: api-token

ingress:
  enabled: true
  className: ""          # empty = cluster default IngressClass (Traefik)
  annotations: {}
  tls:
    enabled: false
    secretName: ""

postgres:
  mode: cnpg             # cnpg | statefulset
  # CloudNativePG's Postgres 19 build pinned by digest, plus pgvector (deploy/postgres/cnpg.Dockerfile), served by the in-cluster registry so the
  # node can always pull it again. A Postgres beta's data files open only with the build that wrote them: the `19beta4` tag on Docker Hub was
  # rebuilt with a new catalog version and the old build was gone from the node, which took the live database down (2026-10-25). Change this
  # only together with a dump and restore, or pg_upgrade. deploy.sh builds and pushes it when the registry lacks it.
  image: registry.local:5000/platform/postgres-cnpg:19beta4-202609281634-u999@sha256:2baddfe22d0422a54cb06ecd15ff342cb9956ac1c286dd89bfc365179ad54c2d
  instances: 1
  database: manythreads
  owner: manythreads_owner
  appRole: manythreads_app
  systemRole: manythreads_system   # roles are created by the server's migrations; the chart only supplies passwords
  uid: 999
  gid: 999
  storage:
    size: 10Gi
    storageClass: local-path
  resources: {}

server:
  enabled: true
  image: manythreads/server
  replicas: 1
  port: 3000
  # MANYTHREADS_TRUST_PROXY: how many reverse-proxy hops append to X-Forwarded-For before the server. The ingress (Traefik)
  # and the web pod's nginx each append one, so the real client is two hops out; 1 would make every visitor look like
  # Traefik (one shared sign-in lockout). Set it to the number of proxies in front of the server pod.
  trustProxy: "2"
  env: {}
  resources: {}
  # Attachment bytes (storage-local, MANYTHREADS_STORAGE_DIR). Without a volume an upload lives in the pod's disk and
  # vanishes on restart. One PVC (local-path, ReadWriteOnce) mounted at mountPath in the server pod and in the seed Job.
  # ReadWriteOnce means ONE server replica: the Deployment uses the Recreate strategy (the old pod lets go of the volume
  # before the new one starts, a few seconds of downtime per deploy), and the seed Job is pinned to the server's node.
  # More than one replica needs a ReadWriteMany class or an object-storage provider. `keep` leaves the claim (and so every
  # upload) behind on `helm uninstall`; set it false only for a throwaway environment.
  blobs:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
      accessMode: ReadWriteOnce
      keep: true
      mountPath: /data/blobs
  # Where attachment bytes live (MANYTHREADS_STORAGE): `local` (storage-local, the volume above; the default) or `s3` (storage-s3: AWS S3,
  # MinIO, R2, Ceph; docs/plugins/storage-s3.md). Exactly one provider loads. Switching stores does not move blobs: copy the objects first.
  # With `s3` the server and the seed Job get MANYTHREADS_S3_*; the credentials come from a Secret, never from the Deployment's text:
  #   - `existingSecret`: a Secret you made, with the keys `accessKeyKey` and `secretKeyKey` (default access-key / secret-key), or
  #   - `accessKey` and `secretKey` here (pass them with --set-file or a values file kept out of git): the chart then makes the Secret
  #     `manythreads-s3` (kept on uninstall), or
  #   - neither: the AWS credential chain of the pod (a role bound to the service account) applies.
  # The bucket must exist and be private (the chart never creates it). `blobs.persistence.enabled` can be false with s3.
  storage:
    type: local
    s3:
      bucket: ""
      endpoint: ""            # empty = AWS; MinIO and most self-hosted stores: http(s)://host:9000
      region: us-east-1
      forcePathStyle: false   # true for MinIO and most self-hosted stores
      prefix: blobs/
      existingSecret: ""
      accessKeyKey: access-key
      secretKeyKey: secret-key
      accessKey: ""
      secretKey: ""
  # Garbage collection of attachment bytes no row references (job files.blob-gc, daily 03:17 UTC; docs/plugins/files.md). `mode`: on | dry-run | off
  # (anything but the word `on` means dry-run: a typo never deletes). It ships as dry-run: read the job's log line, then set "on" once you are sure the
  # bucket/prefix (or the blobs volume) belongs to this deployment's database ALONE; the GC also refuses to delete when the instance marker kept in the
  # store differs from the database's. `allowEmpty` lifts the "database holds no files row" guard: set it once only on a deployment that really
  # deleted its last file. `adoptMarker` adopts the store's marker for a database restored from a backup (set it once, then unset it).
  blobGc:
    mode: "dry-run"
    adoptMarker: false
    graceHours: 24
    orphanDays: 30
    allowEmpty: false
  # Team repositories (repo-git, MANYTHREADS_REPO_DIR): one bare git repository per team, `<team id>.git`, written by the server only.
  # Same shape and same rules as blobs above (ReadWriteOnce: one server replica; `keep` leaves the claim, and so every page and bot
  # definition, behind on `helm uninstall`). The server image carries the `git` binary. Losing this volume loses history: back it up
  # with the database (docs/plugins/repo-git.md, Backups).
  repos:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
      accessMode: ReadWriteOnce
      keep: true
      mountPath: /data/repos

# Backups (docs/deploy/backup.md). Off by default: a self-hoster turns it on with `--set backup.enabled=true`. When on, a CronJob writes one set a day
# (schedule is UTC cron) into its own volume: a pg_dump of each database in `databases`, a tar of the attachment store (local store only; with the S3
# store protect the bucket instead) and a tar of the team repositories, plus a manifest with sizes, checksums and row counts. The newest `retention`
# sets are kept. The volume is on the same disk as the data unless storageClass says otherwise: copy sets off the box (tools/backup/pull.sh).
# Size the volume to hold `retention` + 1 sets (the new set is written before the oldest is removed): about that many x (database dump + blob
# volume used + repository volume used).
# The volume is a WaitForFirstConsumer claim that only the backup Job mounts, so on a cluster that binds on first use `helm --wait` sees it Pending
# until the first run: on the first rollout either run without --wait, or start a run by hand (`kubectl create job --from=cronjob/manythreads-backup`).
backup:
  enabled: false
  schedule: "17 2 * * *"
  retention: 7
  databases: [manythreads]    # add hindsight when the memory engine runs in this release
  activeDeadlineSeconds: 3600
  storage:
    size: 10Gi
    storageClass: local-path
    keep: true                # leave the volume (and every set) behind on helm uninstall
  resources:                  # pg_dump and tar stream; the node has no spare memory to lend (MISTAKES.md, 2026-10-28)
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Mail. The server sends sign-in, reset and invitation mail over SMTP (MANYTHREADS_SMTP_URL).
mail:
  from: "manythreads <no-reply@manythreads.kahf.to>"
  # Empty = the in-cluster mailpit below (only when mailpit.enabled). A real relay: smtp://user:pass@host:587
  smtpUrl: ""

# In-cluster mail catcher for the test environment: a Deployment + ClusterIP Service, never exposed by the ingress
# (read mail with `kubectl -n manythreads port-forward svc/manythreads-mailpit 8025`). Turn off with a real relay.
mailpit:
  enabled: true
  image: axllent/mailpit:v1.31
  resources: {}

# Secrets generated once and kept across upgrades (lookup): manythreads-server-secrets holds the KMS master key
# (MANYTHREADS_KMS_KEY, base64 of 32 bytes: envelope encryption of provider client secrets; losing it loses them) and the
# test sign-in token. The secret has helm.sh/resource-policy: keep, so `helm uninstall` leaves it.
#
# testAuth: TEST ENVIRONMENTS ONLY. Exposes POST /api/test/session (sign in as any persona with header x-test-auth). The
# screenshots workflow does NOT need it (it sets a one-off password with the admin CLI and signs in through the form). The server refuses to start in production with the token set
# unless MANYTHREADS_ALLOW_TEST_AUTH_IN_PRODUCTION=1 as well, which this flag sets. The Secret is generated either way;
# enabled only controls whether the server gets the variables. Never enable it on a real deployment.
testAuth:
  enabled: false

# KMS master-key rotation. MANYTHREADS_KMS_PREVIOUS_KEYS: comma-separated base64 (32 bytes each) of the keys the current
# MANYTHREADS_KMS_KEY replaced, until `admin kms-rewrap` has finished (docs/deploy.md). Empty (the default) = none, and a
# value already stored in the cluster is kept, so a later deploy that does not pass it does not drop it. It lives in the
# Secret manythreads-server-secrets (key kms-previous-keys), never in the Deployment. Clear it after the rewrap with `-`.
kms:
  previousKeys: ""

# Seed: a post-install/upgrade Job runs `pnpm seed --demo` from the server image: workspace Kahf Software, the seven
# personas, three teams, their conversations (seed v3) and the content of their repositories (seed v4: pages with history, a CSV, a
# Mermaid diagram, an embedded app, memory, bot placeholders, plus a PDF, PNG, MP4 and Office file in #dev). Idempotent (a second run changes
# nothing) and the passwords are random and unknown (hashes only), so the public site has no credentials; people get in through single
# sign-on, an invitation, or a password an operator sets with the admin CLI.
# The Job writes where the server reads: it mounts the repository volume (server.repos, MANYTHREADS_REPO_DIR; the git binary is in the
# server image) and, with the local store, the blob volume (server.blobs), and runs on the server's node (both claims are ReadWriteOnce).
# With server.storage.type=s3 it gets the same MANYTHREADS_S3_* as the server and uploads the attachments to the bucket instead.
# Without a repository volume it runs with --no-repo (a repository the Job made would live in its own disk); without a blob volume (local
# store) it runs with --no-attachment.
seed:
  demo: true
  # fixedPasswords: give every persona the known test password instead of a random one, so a
  # browser test can sign in as them. The CI release on the devbox turns it on (values-ci.yaml);
  # never on a public deployment, where a random, unrecoverable password is the rule.
  fixedPasswords: false
  resources: {}          # of the seed Job's container; a namespace with a LimitRange default may need an explicit memory limit here

web:
  enabled: true
  image: manythreads/web
  replicas: 1
  resources: {}
  # Public screenshot gallery at /screenshots/ (a volume the nginx serves; filled by tools/devbox/publish-screenshots.sh). Off here,
  # on in values-live.yaml. The pictures are public by design: never put anything in it that is not meant for anyone with the link.
  screenshots:
    enabled: false
    size: 1Gi
    storageClass: local-path

# LLM gateway (LiteLLM) and team memory (Hindsight). Off in the base values (the CI namespace keeps them off to save memory);
# values-live.yaml turns them on for the live install, and tools/devbox/deploy.sh applies it. Keys are generated once into the
# Secret manythreads-llm-secrets (kept across upgrades). Providers are NOT configured here: use Workspace -> LLM API in the product.
litellm:
  enabled: false
  image: ghcr.io/berriai/litellm:main-stable
  resources: {}
hindsight:
  enabled: false          # needs litellm.enabled
  image: ghcr.io/vectorize-io/hindsight:0.10.3
  llmModel: fast          # the LiteLLM alias its fact extraction calls
  extractionMode: concise # `chunks` calls no model
  # Skip the model check at start-up. True while no provider is configured behind the alias `fast`
  # (the check would fail and the pod never become ready); set "false" once a provider is configured.
  skipLlmVerification: "true"
  resources: {}
# Hermes runs on the host through a runner, never in the cluster: this switch only fails the render if turned on.
hermes: { enabled: false }

# Demo stand-ins (fake-llm, fake-hindsight, Hermes in the server image): off by
# default; deploy/helm/manythreads/values-demo.yaml turns them on (`deploy.sh --demo`).
demo:
  enabled: false
  image: manythreads/demo-fakes

# Managed Hermes pods ("mode B", docs/plugins/hermes-pods.md): the platform runs one pod per team (`hermes-<team>`) holding the team's bots.
# The server's hermes-pods plugin creates and updates them through the Kubernetes API (a ServiceAccount of its own with a Role in THIS
# namespace only). Off in the base values; values-live.yaml turns it on. The two images are built by tools/devbox/deploy.sh
# (deploy/images/hermes-pod, deploy/images/workbench) and imported into k3s; nothing is pulled from a registry.
hermesPods:
  enabled: false
  images:
    hermes: manythreads/hermes-pod:1      # Hermes Agent (official installer) + the profile sync
    workbench: manythreads/workbench:2    # the bots' shell: Playwright/Chromium, git, node, python, kubectl, helm, sshd
  workspaceSize: 10Gi        # /workspace of each team's workbench (repositories of record + every bot's clone)
  homeSize: 2Gi              # the Hermes container's profiles (state.db, sessions) and ssh keys
  storageClass: local-path
  # Repositories of record created in every team's workbench: "name" or "name=https://origin/url" (bots may create more themselves).
  repos: []
  # https:// URL prefixes a repository of record may be cloned from (the `name=url` form of `repos`). Empty = no origin is accepted.
  repoOriginAllow: []
  # Bots whose slug is `deployer` get the namespace-scoped deployer credential (below). Empty = no bot gets one.
  deployerBot: deployer
  hermesResources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 3Gi }
  workbenchResources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 4Gi }
  # Namespace of the teams' pods. Pod security "baseline" is enforced there; the controller's rights are limited to it.
  namespace: manythreads-bots
  # Teams whose deployer bot may ship apps. Each gets a namespace `<apps.prefix><team slug>` (pod security "restricted", a quota, default limits,
  # default-deny network policy) and its own deployer account. A team not listed gets no deployer credential. The list is in the chart on purpose:
  # creating namespaces and roles at run time would give the server the power to grant itself anything.
  appTeams: [engineering, marketing, customer-support]
  apps:
    prefix: apps-
    # How deployed apps are reached.
    #   path (default)  https://<domain>/apps/<team>/<app>/ on the platform's own host: no wildcard DNS record or certificate. The chart puts a
    #                   middleware chain in each apps namespace that keeps the platform's cookies from the app and loads the app in a sandbox.
    #   host            https://<app>--<team>.<host>/: ONE label under the host, so one wildcard certificate (`*.<host>`, see `tls`) covers them
    #                   all; a wildcard DNS name `*.<host>` must point at the cluster.
    routing: path
    # `host` routing only: the domain app hosts live under. Empty = `domain`. (`path` routing always uses `domain`.)
    host: ""
    quota:
      pods: "20"
      requests.cpu: "4"
      requests.memory: 8Gi
      limits.memory: 16Gi
      persistentvolumeclaims: "5"
      requests.storage: 20Gi
      services: "10"
      count/ingresses.networking.k8s.io: "10"
    limitRange:
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 512Mi }
      max: { memory: 4Gi }
  # The Kubernetes API address as a pod reaches it AFTER service NAT, for the network policy (k3s: the node's IP, port 6443). Empty = look up
  # the `kubernetes` endpoints at render time; the render FAILS when that finds nothing (helm template), so set it explicitly there.
  apiServer:
    cidr: ""
    port: 6443
  # The Kubernetes API address as the HOST reaches it (k3s: https://127.0.0.1:6443), for a deployer bot that runs on the host through the agent
  # bridge, where kubernetes.default.svc does not resolve. Set = the deployer Secret also holds `deployer.host.kubeconfig`, the same login with this
  # address (docs/deploy-preview.md). Empty (the default) = only `deployer.kubeconfig`.
  hostApiServer: ""
  # Deploy targets: whole namespaces where a team's deployer bot has full control of what runs in them, to try a modified copy of the platform
  # (docs/deploy-preview.md). Each entry makes: the namespace (pod security `podSecurity`, labelled manythreads.io/deploy-target=true), a
  # `deployer` account with a Role in that namespace only (workloads, Jobs, Secrets, volumes, Ingress, pods/exec, and the database operator's
  # and cert-manager's own objects; no RBAC objects, nothing cluster-wide), a quota, default limits, default-deny network policies, and an
  # admission rule that limits Ingress hosts to `hosts`. The team's deployer bot gets one more kubeconfig context per target (named after the
  # namespace). Empty (the default) = none. Example:
  #   - { team: engineering, namespace: test-manythreads, hosts: [test.manythreads.kahf.to], podSecurity: baseline }
  # `quota` and `limitRange` per entry replace the defaults below for that entry (whole map). `podSecurity` must stay `baseline` for builds
  # with kaniko (it runs as root inside its container, unprivileged); `restricted` blocks it.
  deployTargets: []
  deployTargetDefaults:
    # Sized for ONE install of the platform (database, server, web, mail catcher, the seed Job) plus ONE image build at a time (kaniko takes up
    # to 4Gi) with a margin; the node has 15 GB in all, so keep the memory limit below what the live install can spare.
    quota:
      pods: "25"
      requests.cpu: "4"
      requests.memory: 6Gi
      limits.memory: 8Gi
      # Disk the pods write to (not volumes): a build (two kaniko containers one after the other, each capped at 10Gi) plus an install fits. Limits are
      # ceilings, not reservations, and a build rarely reaches its cap; the node has only ~11 GB free, so keep the sum of limits near that, not above.
      requests.ephemeral-storage: 8Gi
      limits.ephemeral-storage: 16Gi
      persistentvolumeclaims: "6"
      requests.storage: 12Gi
      services: "12"
      count/ingresses.networking.k8s.io: "4"
      count/jobs.batch: "12"
      count/secrets: "60"
      count/configmaps: "40"
    limitRange:
      defaultRequest: { cpu: 50m, memory: 64Mi, ephemeral-storage: 128Mi }
      default: { memory: 512Mi, ephemeral-storage: 2Gi }
      max: { memory: 6Gi, ephemeral-storage: 10Gi }

# In-cluster image registry (docs/deploy-preview.md): a `registry:2` in its own namespace, where builds inside the cluster (kaniko, in a deploy
# target) push images and the node's containerd pulls them. The Service `registry` (ClusterIP :5000) is for pushes; the NodePort Service is for the node's
# own pulls and needs ONE host step (docs/deploy-preview.md "Host step"). There is NO sign-in on it: anyone in a deploy-target namespace can push and
# pull, and the network policy lets nobody else in (the node itself, for pulls). Off by default.
registry:
  enabled: false
  namespace: manythreads-registry
  image: registry:2.8.3
  # Images are large (the server image is over 1 GB): the disk of this node is small, so watch this volume, and delete old tags.
  size: 10Gi
  storageClass: local-path
  nodePort: 30500
  # Addresses the node's own pulls arrive from after the NodePort translation. Block 30500 from outside on the host firewall too.
  nodeCidrs: ["10.0.2.15/32"]
