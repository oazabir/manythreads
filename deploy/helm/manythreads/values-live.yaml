# The live install (namespace `manythreads`): a real LLM gateway (LiteLLM) and a real memory engine (Hindsight) next to the server.
# tools/devbox/deploy.sh applies this file on every deploy. values-ci.yaml does not (the test namespace stays small and starts fresh
# each run), and values-demo.yaml switches both off again in favour of its stand-ins.
litellm:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
hindsight:
  enabled: true
  # The live workspace binds `fast` to a real model (Workspace → LLM), so Hindsight's startup check of it stays on.
  skipLlmVerification: "false"
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 4Gi }
web:
  screenshots:
    enabled: true
hermesPods:
  enabled: true
  apps:
    routing: path        # apps at https://manythreads.kahf.to/apps/<team>/<app>/: the main certificate covers them, no wildcard
    host: manythreads.kahf.to   # used only by routing: host
  apiServer:
    cidr: 10.0.2.15/32   # k3s on the devbox: the node IP (kubectl get endpoints kubernetes)
  # The devbox's host bots (agent bridge) reach the k3s API here; k3s's certificate names 127.0.0.1.
  hostApiServer: https://127.0.0.1:6443
  # Teams whose deployer bot ships apps (apps-<team>); Delivery runs the full-cycle preview (deployTargets below).
  appTeams: [engineering, marketing, customer-support, delivery]
  # Projects (docs/plugins/projects.md) whose repository starts with one of these are cloned into the team's pod.
  repoOriginAllow:
    - https://github.com/oazabir/
  # The Delivery team's deployer bot may run a modified copy of the platform here (docs/deploy-preview.md).
  deployTargets:
    - team: delivery
      namespace: test-manythreads
      hosts: [test.manythreads.kahf.to]
      podSecurity: baseline
# Images built inside the cluster for that copy. Needs the one host step in docs/deploy-preview.md (registries.yaml) before a pod can pull from it.
registry:
  enabled: true
