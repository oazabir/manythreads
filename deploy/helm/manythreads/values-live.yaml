# The live install (namespace `manythreads`): a real LLM gateway (LiteLLM) and a real memory engine (Hindsight) next to the server.
# tools/devbox/deploy.sh applies this file on every deploy. values-ci.yaml does not (the test namespace stays small and starts fresh
# each run), and values-demo.yaml switches both off again in favour of its stand-ins.
litellm:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
hindsight:
  enabled: true
  # The live workspace binds `fast` to a real model (Workspace → LLM), so Hindsight's startup check of it stays on.
  skipLlmVerification: "false"
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 4Gi }
web:
  screenshots:
    enabled: true
hermesPods:
  enabled: true
  apps:
    routing: path        # apps at https://manythreads.kahf.to/apps/<team>/<app>/: the main certificate covers them, no wildcard
    host: manythreads.kahf.to   # used only by routing: host
  apiServer:
    cidr: 10.0.2.15/32   # k3s on the devbox: the node IP (kubectl get endpoints kubernetes)
