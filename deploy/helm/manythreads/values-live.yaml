# The live install (namespace `manythreads`): a real LLM gateway (LiteLLM) and a real memory engine (Hindsight) next to the server.
# tools/devbox/deploy.sh applies this file on every deploy. values-ci.yaml does not (the test namespace stays small and starts fresh
# each run), and values-demo.yaml switches both off again in favour of its stand-ins.
litellm:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1536Mi }   # peak 958Mi, steady ~760Mi (cgroup memory.peak, 2026-10-28)
hindsight:
  enabled: true
  # The live workspace binds `fast` to a real model (Workspace → LLM), so Hindsight's startup check of it stays on.
  skipLlmVerification: "false"
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 4Gi }
# Memory limits for the rest of the install (2026-10-28: the host ran out of memory and rebooted; these pods had no limit at all, so a runaway one
# could take the node down with it. Measured use: server ~240Mi, Postgres ~100Mi, web and mailpit well under 100Mi).
postgres:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }
server:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
mailpit:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 256Mi }
web:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  screenshots:
    enabled: true
hermesPods:
  enabled: true
  # The Hermes container peaked at ~420Mi (cgroup memory.peak, 2026-10-28); the chart default of 3Gi was far above that. The workbench (builds,
  # browsers) keeps the default: it was idle when measured.
  hermesResources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1536Mi }
  apps:
    routing: path        # apps at https://manythreads.kahf.to/apps/<team>/<app>/: the main certificate covers them, no wildcard
    host: manythreads.kahf.to   # used only by routing: host
  apiServer:
    cidr: 10.0.2.15/32   # k3s on the devbox: the node IP (kubectl get endpoints kubernetes)
  # The devbox's host bots (agent bridge) reach the k3s API here; k3s's certificate names 127.0.0.1.
  hostApiServer: https://127.0.0.1:6443
  # Teams whose deployer bot ships apps (apps-<team>); Engineering runs the full-cycle preview (deployTargets below).
  appTeams: [engineering, marketing, customer-support, delivery]
  # Projects (docs/plugins/projects.md) whose repository starts with one of these are cloned into the team's pod.
  repoOriginAllow:
    - https://github.com/oazabir/
  # The Engineering team's deployer bot (on the team's managed Hermes pod) may run a modified copy of the platform here (docs/deploy-preview.md).
  # A target belongs to one team; it was Delivery's while that team's bots ran on the agent bridge.
  deployTargets:
    - team: engineering
      namespace: test-manythreads
      hosts: [test.manythreads.kahf.to]
      podSecurity: baseline
# Images built inside the cluster for that copy. Needs the one host step in docs/deploy-preview.md (registries.yaml) before a pod can pull from it.
registry:
  enabled: true
