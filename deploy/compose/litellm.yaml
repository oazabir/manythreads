# LiteLLM proxy config for the dev compose stack (PLAN P5-06). The models and the fallback chains are NOT written here: the
# gateway-llm plugin owns them and pushes them from the database (POST /model/new, /model/update, /model/delete and
# /config/update), so this file only starts the proxy. The master key and the salt come from the environment
# (LITELLM_MASTER_KEY, LITELLM_SALT_KEY; see dev.env.example).

model_list: []

general_settings:
  # Virtual keys are stored in the proxy's own database (the `litellm` database of the dev Postgres).
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true

# No `router_settings` here, on purpose: LiteLLM refuses to change (400 "is set in the config file and cannot be changed here")
# any setting the file names, so a `fallbacks: []` default would make every config push from the gateway-llm plugin fail. The
# fallback chains are owned by the database (the plugin pushes them with POST /config/update); a fresh proxy has none.
