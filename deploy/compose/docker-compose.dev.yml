services:
  postgres:
    build: ../postgres
    image: manythreads/postgres:19
    environment:
      POSTGRES_USER: manythreads_owner
      POSTGRES_PASSWORD: manythreads
      POSTGRES_DB: manythreads
    ports:
      - "55432:5432"
    volumes:
      - manythreads_pgdata:/var/lib/postgresql
      # Creates the `litellm` database the LLM gateway's proxy stores its virtual keys in (PLAN P5-06, profile `llm`).
      # Runs only on the first init of the volume; an existing volume needs the database created by hand (see the file).
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    # `memory` too: Hindsight keeps its banks in the `hindsight` database of this server and nothing else on `default` needs to know that.
    networks: [default, memory]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manythreads_owner -d manythreads"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mock OIDC provider that plays Google and Microsoft in dev and e2e.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      # Issuers google, microsoft and any with their default claims; see tools/mock-oidc/README.md.
      - ../../tools/mock-oidc/config.json:/config/config.json:ro
    ports:
      - "8080:8080"

  # Catches outgoing mail (SMTP 1025, web UI 8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # Optional (profile `s3`): an S3-compatible store for the `storage-s3` plugin and its tests (`pnpm s3:up`; API on 9000, console on 9001).
  # Run the suite with MANYTHREADS_TEST_S3=1 pnpm --filter @manythreads/plugin-storage-s3 exec vitest run; point the server at it with
  # MANYTHREADS_STORAGE=s3 MANYTHREADS_S3_ENDPOINT=http://localhost:9000 MANYTHREADS_S3_BUCKET=manythreads MANYTHREADS_S3_FORCE_PATH_STYLE=true
  # MANYTHREADS_S3_ACCESS_KEY=manythreads MANYTHREADS_S3_SECRET_KEY=manythreads-secret (see dev.env.example). Create the bucket first (console, or mc).
  # The image is the last community release (MinIO no longer publishes images; this is a mirror of that release).
  minio:
    profiles: ["s3"]
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: manythreads
      MINIO_ROOT_PASSWORD: manythreads-secret
    ports:
      # loopback only: a fixed root password must not be reachable from the network the dev machine is on
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - manythreads_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # LLM gateway (profile `llm`, PLAN P5-06): the LiteLLM proxy the `gateway-llm` plugin configures from the database.
  # `pnpm llm:up` (or `docker compose -f deploy/compose/docker-compose.dev.yml --profile llm up -d litellm`) starts it; the
  # models and fallback chains are pushed by the plugin, so litellm.yaml only starts the proxy. Keys live in the `litellm`
  # database of the dev Postgres (deploy/postgres/init/10-litellm-db.sql). Point the server at it with
  # MANYTHREADS_LITELLM_URL=http://localhost:4000 and MANYTHREADS_LITELLM_MASTER_KEY=<LITELLM_MASTER_KEY> (dev.env.example).
  litellm:
    profiles: ["llm"]
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/config/litellm.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${MANYTHREADS_LITELLM_MASTER_KEY:-sk-manythreads-dev-master}
      LITELLM_SALT_KEY: ${MANYTHREADS_LITELLM_SALT_KEY:-sk-manythreads-dev-salt}
      STORE_MODEL_IN_DB: "True"
      DATABASE_URL: postgresql://manythreads_owner:manythreads@postgres:5432/litellm
    volumes:
      - ./litellm.yaml:/config/litellm.yaml:ro
    ports:
      # loopback only: a fixed development master key must not be reachable from the network the dev machine is on
      - "127.0.0.1:4000:4000"
    # `memory` too: Hindsight's fact extraction goes through the one LLM gateway (it never holds a provider key).
    networks: [default, memory]
    depends_on:
      postgres: { condition: service_healthy }

  # Team memory (profile `memory`, PLAN P5-12): Hindsight, the retrieval engine behind `memory-hindsight` (SPEC 12.1). `pnpm memory:up` starts it
  # (it creates the `hindsight` database on an old volume first); point the server at it with MANYTHREADS_HINDSIGHT_URL=http://localhost:8888 and
  # MANYTHREADS_HINDSIGHT_API_KEY=<HINDSIGHT_API_TENANT_API_KEY> (dev.env.example).
  #
  # "Reachable only from the gateway" is the network, in this phase: the container is on `memory` and on nothing else, and only postgres, litellm and
  # the manythreads server join `memory`. A container on `default` (the Hermes workers of phase 10) cannot resolve or route to `hindsight`, so it cannot
  # call it, with or without the api key. The loopback port below exists so tests and the dev server running on the HOST can reach the engine; the
  # self-host compose and the chart must not publish it (NetworkPolicy checks are phase 10). The control-plane UI (9999) is not published: it would
  # show every team's bank to whoever opened it.
  hindsight:
    profiles: ["memory"]
    image: ghcr.io/vectorize-io/hindsight:${MANYTHREADS_HINDSIGHT_TAG:-latest}
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://manythreads_owner:manythreads@postgres:5432/hindsight
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${MANYTHREADS_HINDSIGHT_API_KEY:-hs-manythreads-dev}
      # Fact extraction is an LLM call; it goes to the LiteLLM proxy (profile `llm`, alias `fast`) like every other model call.
      HINDSIGHT_API_LLM_PROVIDER: ${MANYTHREADS_HINDSIGHT_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_BASE_URL: ${MANYTHREADS_HINDSIGHT_LLM_BASE_URL:-http://litellm:4000/v1}
      HINDSIGHT_API_LLM_API_KEY: ${MANYTHREADS_HINDSIGHT_LLM_API_KEY:-sk-manythreads-dev-master}
      HINDSIGHT_API_LLM_MODEL: ${MANYTHREADS_HINDSIGHT_LLM_MODEL:-fast}
    networks: [memory]
    ports:
      # loopback only, dev convenience (see above)
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  # Optional (profile `app`): the server image against the dev Postgres, with the same environment the Helm chart sets
  # (KMS key, public URL, proxy trust, mail through mailpit). `docker compose -f deploy/compose/docker-compose.dev.yml
  # --profile app up -d --build server`; `pnpm db:up` does not start it. Set MANYTHREADS_KMS_KEY first (see dev.env.example).
  # A self-host compose file (all five workloads) comes in phase 10.
  server:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    image: manythreads/server:dev
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://manythreads_owner:manythreads@postgres:5432/manythreads
      MANYTHREADS_APP_DATABASE_URL: postgres://manythreads_app:manythreads_app@postgres:5432/manythreads
      MANYTHREADS_SYSTEM_DATABASE_URL: postgres://manythreads_system:manythreads_system@postgres:5432/manythreads
      MANYTHREADS_KMS_KEY: ${MANYTHREADS_KMS_KEY:-}  # required by the production image: openssl rand -base64 32
      MANYTHREADS_PUBLIC_URL: ${MANYTHREADS_PUBLIC_URL:-http://localhost:3000}
      MANYTHREADS_TRUST_PROXY: ${MANYTHREADS_TRUST_PROXY:-0}
      MANYTHREADS_SMTP_URL: smtp://mailpit:1025
      MANYTHREADS_MAIL_FROM: ${MANYTHREADS_MAIL_FROM:-manythreads <no-reply@localhost>}
      # Empty unless the `llm` profile is up (then http://litellm:4000): with no URL the gateway mints and stores keys
      # but pushes no config, rather than retrying against a proxy that was never started.
      MANYTHREADS_LITELLM_URL: ${MANYTHREADS_LITELLM_URL:-}
      MANYTHREADS_LITELLM_MASTER_KEY: ${MANYTHREADS_LITELLM_MASTER_KEY:-}
      # Empty unless the `memory` profile is up (then http://hindsight:8888): the memory tools answer "not configured" without it.
      MANYTHREADS_HINDSIGHT_URL: ${MANYTHREADS_HINDSIGHT_URL:-}
      MANYTHREADS_HINDSIGHT_API_KEY: ${MANYTHREADS_HINDSIGHT_API_KEY:-}
    # The server is the one gateway: it shares `memory` with the engine (and nothing else does).
    networks: [default, memory]
    ports:
      - "3000:3000"

networks:
  default: {}
  # Only the manythreads server (the memory gateway), Hindsight and what Hindsight itself needs (postgres, litellm) are on it.
  memory: {}

volumes:
  manythreads_pgdata:
  manythreads_minio:
