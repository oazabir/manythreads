services:
  postgres:
    build: ../postgres
    image: manythreads/postgres:19
    environment:
      POSTGRES_USER: manythreads_owner
      POSTGRES_PASSWORD: manythreads
      POSTGRES_DB: manythreads
    ports:
      - "55432:5432"
    volumes:
      - manythreads_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manythreads_owner -d manythreads"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mock OIDC provider that plays Google and Microsoft in dev and e2e.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      # Issuers google, microsoft and any with their default claims; see tools/mock-oidc/README.md.
      - ../../tools/mock-oidc/config.json:/config/config.json:ro
    ports:
      - "8080:8080"

  # Catches outgoing mail (SMTP 1025, web UI 8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # Optional (profile `s3`): an S3-compatible store for the `storage-s3` plugin and its tests (`pnpm s3:up`; API on 9000, console on 9001).
  # Run the suite with MANYTHREADS_TEST_S3=1 pnpm --filter @manythreads/plugin-storage-s3 exec vitest run; point the server at it with
  # MANYTHREADS_STORAGE=s3 MANYTHREADS_S3_ENDPOINT=http://localhost:9000 MANYTHREADS_S3_BUCKET=manythreads MANYTHREADS_S3_FORCE_PATH_STYLE=true
  # MANYTHREADS_S3_ACCESS_KEY=manythreads MANYTHREADS_S3_SECRET_KEY=manythreads-secret (see dev.env.example). Create the bucket first (console, or mc).
  # The image is the last community release (MinIO no longer publishes images; this is a mirror of that release).
  minio:
    profiles: ["s3"]
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: manythreads
      MINIO_ROOT_PASSWORD: manythreads-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - manythreads_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional (profile `app`): the server image against the dev Postgres, with the same environment the Helm chart sets
  # (KMS key, public URL, proxy trust, mail through mailpit). `docker compose -f deploy/compose/docker-compose.dev.yml
  # --profile app up -d --build server`; `pnpm db:up` does not start it. Set MANYTHREADS_KMS_KEY first (see dev.env.example).
  # A self-host compose file (all five workloads) comes in phase 10.
  server:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    image: manythreads/server:dev
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://manythreads_owner:manythreads@postgres:5432/manythreads
      MANYTHREADS_APP_DATABASE_URL: postgres://manythreads_app:manythreads_app@postgres:5432/manythreads
      MANYTHREADS_SYSTEM_DATABASE_URL: postgres://manythreads_system:manythreads_system@postgres:5432/manythreads
      MANYTHREADS_KMS_KEY: ${MANYTHREADS_KMS_KEY:-}  # required by the production image: openssl rand -base64 32
      MANYTHREADS_PUBLIC_URL: ${MANYTHREADS_PUBLIC_URL:-http://localhost:3000}
      MANYTHREADS_TRUST_PROXY: ${MANYTHREADS_TRUST_PROXY:-0}
      MANYTHREADS_SMTP_URL: smtp://mailpit:1025
      MANYTHREADS_MAIL_FROM: ${MANYTHREADS_MAIL_FROM:-manythreads <no-reply@localhost>}
    ports:
      - "3000:3000"

volumes:
  manythreads_pgdata:
  manythreads_minio:
