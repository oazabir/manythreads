# nginx image templates: only ${MAJLIS_SERVER_HOST} and ${MAJLIS_SERVER_PORT} are substituted
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  location /api/ { proxy_pass http://${MAJLIS_SERVER_HOST}:${MAJLIS_SERVER_PORT}; }
  location = /healthz { proxy_pass http://${MAJLIS_SERVER_HOST}:${MAJLIS_SERVER_PORT}; }
  location = /readyz { proxy_pass http://${MAJLIS_SERVER_HOST}:${MAJLIS_SERVER_PORT}; }
  location /ws {
    proxy_pass http://${MAJLIS_SERVER_HOST}:${MAJLIS_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
