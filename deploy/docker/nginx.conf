# nginx image templates: only ${MANYTHREADS_SERVER_HOST}, ${MANYTHREADS_SERVER_PORT} and ${MANYTHREADS_MCP_STREAM_TIMEOUT} are substituted
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # `/api/` carries plugin socket routes too (a live page is one), so it must speak HTTP/1.1 and pass the upgrade: with a
  # plain proxy_pass the upgrade arrives as an ordinary GET and the server answers 404 (the live editor then reads "offline").
  # The headers are repeated because a location that sets any `proxy_set_header` inherits none from the server block.
  location /api/ {
    proxy_pass http://${MANYTHREADS_SERVER_HOST}:${MANYTHREADS_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }
  # The one MCP address every bot calls (`POST /mcp`); the bearer token says which bot or run. `GET /mcp` with `Accept: text/event-stream` is the
  # bot's tools stream (PLAN P14-22): it lives up to 30 minutes and sends a keepalive every 25 s, so it must not be buffered and the read timeout
  # must be over 30 minutes (MANYTHREADS_MCP_STREAM_TIMEOUT, Helm value web.mcpStreamTimeout, default 1900s). The server also sends
  # `X-Accel-Buffering: no`; `proxy_buffering off` is here so the stream holds even if a proxy in between drops that header.
  location = /mcp {
    proxy_pass http://${MANYTHREADS_SERVER_HOST}:${MANYTHREADS_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout ${MANYTHREADS_MCP_STREAM_TIMEOUT};
  }
  # Incoming webhooks (`POST /hooks/<id>/<secret>`): CI, GitHub, GitLab, alert managers and scripts post here. The server caps the body at 1 MB; the
  # same cap is set here so nginx stops a larger one before it reaches the server (the default cap is 1 MB too, written down so a change is deliberate).
  # The address carries the secret, so this location writes no access log line (nginx would log the whole request line, secret included).
  location /hooks/ {
    access_log off;
    client_max_body_size 1m;
    proxy_pass http://${MANYTHREADS_SERVER_HOST}:${MANYTHREADS_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }
  location = /healthz { proxy_pass http://${MANYTHREADS_SERVER_HOST}:${MANYTHREADS_SERVER_PORT}; }
  location = /readyz { proxy_pass http://${MANYTHREADS_SERVER_HOST}:${MANYTHREADS_SERVER_PORT}; }
  location /ws {
    proxy_pass http://${MANYTHREADS_SERVER_HOST}:${MANYTHREADS_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }

  # The public screenshot gallery: files come from a volume the web pod mounts at /srv/screenshots (tools/devbox/publish-screenshots.sh fills it).
  # Without the volume the directory is absent and the location answers 404. Read-only for the world; the page lists only picture names.
  location /screenshots/ {
    alias /srv/screenshots/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }

  # The service worker for browser push. It must be fetched fresh (a stale one keeps old behaviour on a person's machine) and sits at the root so it can
  # take over the whole site.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # The on-device speech model files (PLAN P14-16): Whisper, the voice-activity model and the ONNX Runtime files, fetched and hash-checked at image
  # build (clients/web/models.lock.json). The revision is part of every address (`/models/<name>/<revision>/...`), so a changed model is a new address
  # and these can be kept for good. A missing file must be a plain 404, never the app's page (`try_files ... =404`). `types` replaces the inherited list:
  # `application/wasm` is what lets the browser compile the runtime while it downloads; the rest are what the loader asks for. Text-like files are
  # compressed on the wire; the .onnx weights are already quantised and go as they are (so the download keeps its Content-Length for the progress bar).
  location /models/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    default_type application/octet-stream;
    types {
      application/wasm wasm;
      application/octet-stream onnx;
      text/javascript mjs;
      application/json json;
    }
    gzip on;
    gzip_types application/wasm text/javascript application/json;
    try_files $uri =404;
  }
  # The diagram frame's page (Mermaid runs in a sandboxed frame with an opaque origin that loads this page). Its own policy, the same text as
  # SANDBOX_CSP in clients/web/src/viewers/mermaid/sandbox.ts (a test keeps them equal): scripts of this site only, nothing fetched, only our app may frame it.
  location = /mermaid-sandbox.html {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
  }

  # The app's page. The script policy: scripts come from this site only (no inline script, no `eval`, none from another address), plug-ins are
  # forbidden, the page may be framed by itself only, and a form posts only to this site. Styles may be inline (React sets `style=` on elements),
  # images and media are this site's own plus `data:`/`blob:` (uploads, previews), and the connections are this site's own (API and socket).
  # `'wasm-unsafe-eval'` lets the browser compile WebAssembly (the speech engine's runtime) and nothing else: JavaScript `eval` stays forbidden.
  # The microphone and camera are allowed to this site's own pages only, so an embedded app's frame can never ask for them.
  # The one outside host is Cloudflare's analytics beacon, which Cloudflare adds in front of the site. Frames are this site's own (the sandboxed
  # app and diagram frames carry their own policy). The browser also keeps each file's own type.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;
    try_files $uri $uri/ /index.html;
  }
}
